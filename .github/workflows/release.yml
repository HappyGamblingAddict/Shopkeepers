# Builds the plugin jar and publishes it as a GitHub release.
#
# This is a fork-friendly variant of build.yml: It does not depend on any repository secrets
# (build.yml runs a SonarCloud analysis that requires a SONAR_TOKEN), and it produces a release
# with the built jar attached.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v1.2.3). Leave empty to only build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-m2
    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle
    - name: Cache Jabba JDK installations
      uses: actions/cache@v5
      with:
        path: ~/.jabba
        key: ${{ runner.os }}-jabba-${{ hashFiles('**/*.sh') }}
        restore-keys: |
          ${{ runner.os }}-jabba

    # Note: This builds the required Spigot and Paper dependencies from source via BuildTools, which
    # takes a long time.
    - name: Build Shopkeepers
      run: ./build.sh

    - name: Determine tag
      id: tag
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi

    # Only the dist module produces the actual plugin jar. The api and main jars are build byproducts
    # that are not meant to be installed on a server.
    - name: Collect the plugin jar
      id: jar
      run: |
        set -euo pipefail
        mkdir -p dist
        # The plugin jar is the one produced by the dist module (artifact id 'Shopkeepers'):
        plugin_jar=$(find build -maxdepth 1 -name 'Shopkeepers-*.jar' ! -name '*API*' ! -name '*Main*' | head -n 1)
        if [ -z "${plugin_jar}" ]; then
          echo "::error::Could not find the plugin jar in the build folder:"
          ls -la build || true
          exit 1
        fi
        cp "${plugin_jar}" dist/
        echo "name=$(basename "${plugin_jar}")" >> "$GITHUB_OUTPUT"
        echo "Collected ${plugin_jar}"

    - name: Upload the plugin jar as a workflow artifact
      uses: actions/upload-artifact@v6
      with:
        name: plugin-jar
        path: dist/*.jar
        if-no-files-found: error

    - name: Publish the GitHub release
      if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.value }}
      run: |
        set -euo pipefail
        jar_name=$(ls dist/*.jar)
        # 'gh release create' fails if the release already exists, so update it instead:
        if gh release view "${TAG}" > /dev/null 2>&1; then
          gh release upload "${TAG}" "${jar_name}" --clobber
        else
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "Automated build of commit ${GITHUB_SHA}." \
            --prerelease \
            "${jar_name}"
        fi
